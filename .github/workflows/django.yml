name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run ruff
      run: |
        pip install ruff
        ruff check .

    - name: Run black check
      run: |
        pip install black
        black --check .

    - name: Run tests
      run: |
        pip install pytest pytest-django
        pytest -q
